name: Build public KhanehYar

on:
  push:
    branches: [ zeytoon-khanehyar-public-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK and release bundle
        run: gradle -p public-android-app assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KhanehYar-public-debug-apk
          path: public-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: KhanehYar-public-release-aab
          path: public-android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
